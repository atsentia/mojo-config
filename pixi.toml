[project]
name = "mojo-config"
version = "0.1.0"
description = "Configuration loading from environment variables and TOML files"
authors = ["IDEA2CODE"]
license = "MIT"
readme = "README.md"

[dependencies]
max = ">=24.6,<25"

[tasks]
build = "mojo build src/__init__.mojo -o config"
test = "mojo test tests/"
format = "mojo format src/ tests/"
